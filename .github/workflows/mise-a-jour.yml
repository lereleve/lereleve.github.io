name: Mise à jour quotidienne

on:
  schedule:
    - cron: "15 5,19 * * *"   # vers 7 h 15 et 21 h 15, heure de Paris
  push:
    branches: [main]       # à chaque modification d'un fichier du dépôt
  workflow_dispatch:       # bouton « Run workflow » dans l'onglet Actions

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  construire:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Récupérer les photos déjà téléchargées
        uses: actions/cache@v4
        with:
          path: site/photos
          key: photos-${{ github.run_id }}
          restore-keys: photos-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Télécharger les données officielles et calculer les indicateurs
        run: python scripts/construire_donnees.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  publier:
    needs: construire
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploiement.outputs.page_url }}
    steps:
      - id: deploiement
        uses: actions/deploy-pages@v4
